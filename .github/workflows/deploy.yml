name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: "0.4.52"

      - name: Install Custom Preprocessor
        run: cargo install mdbook-embed

      - name: Cache Cargo registry (og-cards build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            mdbook-og-cards/target
          key: cargo-og-cards-${{ runner.os }}-${{ hashFiles('mdbook-og-cards/Cargo.lock') }}
          restore-keys: |
            cargo-og-cards-${{ runner.os }}-

      - name: Install OG Cards Preprocessor
        run: cargo install --path mdbook-og-cards --locked

      - name: Cache OG Cards metadata
        uses: actions/cache@v4
        with:
          path: .cache/mdbook-og-cards
          key: og-cards-metadata-${{ hashFiles('src/**/*.md') }}
          restore-keys: |
            og-cards-metadata-

      - name: Build mdBook
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
